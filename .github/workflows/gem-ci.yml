name: Gem CI

# Reusable CI for downstream axn-consuming gems (PRO-2949). Each gem's own .github/workflows/ci.yml
# is a thin caller: `uses: teamshares/axn/.github/workflows/gem-ci.yml@main`. Fix CI once here and
# every gem inherits it — no per-repo edits. The main job always runs `bundle exec rake` (each gem's
# Rakefile default task runs the right suite); the two inputs cover the Rails-topology differences.
#
# CHECK NAMES — the job names below are HALF of each gem's required-status-check context. GitHub
# prefixes a reusable workflow's jobs with the CALLER's job name, which the ci*.yml.tmpl callers pin
# to `CI`, so a gem's branch-protection ruleset must require "CI / Specs (Ruby 3.2)" (etc.), not the
# bare job name. Renaming a job here silently invalidates every consuming gem's required checks —
# their PRs then block forever on a context that never reports. Rename only in lockstep with a
# ruleset update in each gem (`gh api repos/teamshares/<gem>/rulesets/<id>`).
#
# The required set differs by topology, because `rails_specs` is gated off unless asked for. Require
# exactly what runs — a context for a gated-off job is at best meaningless and at worst a permanent
# block:
#   dual        CI / Specs (Ruby X)  +  CI / Rails Specs (Ruby X)
#   pure Ruby   CI / Specs (Ruby X)
#   rails-only  CI / Specs (Ruby X)         <- its default rake IS the Rails suite
#
# A gated-off `rails_specs` is not absent from the check list — it reports exactly once, with the
# literal UNEXPANDED job name, because a job skipped at the job level never expands its matrix.
# Observed on teamshares/axn-ruby_llm#7 (head dd74c50), a pure-Ruby caller passing no
# `rails-specs-job`: three `ci / Specs (Ruby X)` runs succeeded, beside one
# `ci / Rails Specs (Ruby ${{ matrix.ruby }})` concluding `skipped`. A non-dual gem therefore never
# produces `CI / Rails Specs (Ruby 3.2)` in any form, and that literal is the only string GitHub
# emits. Neither is requirable, for opposite reasons:
#   - `CI / Rails Specs (Ruby 3.2)` on a pure-Ruby or rails-only gem blocks every PR forever, since
#     nothing ever reports that context.
#   - the literal `CI / Rails Specs (Ruby ${{ matrix.ruby }})` is worse than useless: GitHub counts a
#     `skipped` conclusion as satisfying a required check, so it would pass unconditionally while
#     looking like real Rails coverage.
on:
  workflow_call:
    inputs:
      ruby-versions:
        description: JSON array of Ruby versions for the test matrix.
        type: string
        default: '["3.2", "3.3", "3.4"]'
      main-needs-dummy-app:
        description: Install the dummy-app bundle (see dummy-app-path) before the main task (rails-only gems, whose default rake runs spec_rails).
        type: boolean
        default: false
      rails-specs-job:
        description: Add a separate job running the Rails dummy-app suite (dual-topology gems, whose default rake is Rails-free).
        type: boolean
        default: false
      dummy-app-path:
        description: Path to the Rails dummy app whose bundle is installed for main-needs-dummy-app / rails-specs-job. Override when the gem keeps it somewhere other than the default (e.g. spec/dummy_app).
        type: string
        default: spec_rails/dummy_app

jobs:
  main:
    runs-on: ubuntu-latest
    # Deliberately topology-neutral, and NOT core's own "Main Specs": this one job runs whatever the
    # gem's default rake task is, which differs per topology. On a rails-only gem that IS the Rails
    # dummy-app suite, so "Main Specs" would name the Rails job "main" and leave the gem with no
    # "Rails Specs" check at all. "Specs" — i.e. "the default task" — is honest for all three.
    name: Specs (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby: ${{ fromJSON(inputs.ruby-versions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Cache dummy app bundle
        if: ${{ inputs.main-needs-dummy-app }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.dummy-app-path }}/vendor/bundle
          key: ${{ runner.os }}-dummy-app-bundle-${{ hashFiles(format('{0}/Gemfile', inputs.dummy-app-path)) }}
          restore-keys: |
            ${{ runner.os }}-dummy-app-bundle-
      - name: Install dummy app dependencies
        if: ${{ inputs.main-needs-dummy-app }}
        run: |
          cd ${{ inputs.dummy-app-path }}
          bundle install --path vendor/bundle
      - name: Run the default task
        run: bundle exec rake

  rails_specs:
    if: ${{ inputs.rails-specs-job }}
    runs-on: ubuntu-latest
    name: Rails Specs (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby: ${{ fromJSON(inputs.ruby-versions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Cache dummy app bundle
        uses: actions/cache@v6
        with:
          path: ${{ inputs.dummy-app-path }}/vendor/bundle
          key: ${{ runner.os }}-dummy-app-bundle-${{ hashFiles(format('{0}/Gemfile', inputs.dummy-app-path)) }}
          restore-keys: |
            ${{ runner.os }}-dummy-app-bundle-
      - name: Install dummy app dependencies
        run: |
          cd ${{ inputs.dummy-app-path }}
          bundle install --path vendor/bundle
      - name: Run Rails specs
        run: bundle exec rake spec_rails
