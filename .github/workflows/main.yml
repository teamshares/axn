name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  main_specs:
    runs-on: ubuntu-latest
    name: Main Specs (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run main specs
      run: bundle exec rake spec
    - name: Run RuboCop linting
      run: bundle exec rake rubocop

  rubocop_specs:
    runs-on: ubuntu-latest
    name: RuboCop Specs (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run RuboCop specs
      run: bundle exec rake spec_rubocop

  rails_specs:
    runs-on: ubuntu-latest
    name: Rails Specs (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    # Installed outside the working tree so nothing that lints this repo can target a vendored
    # dependency's own .rubocop.yml (see gem-ci.yml for the full rationale). This job runs only
    # spec_rails today, but the reusable workflow installs the same bundle before a task that DOES
    # run RuboCop, and the two should not drift.
    - name: Cache dummy app bundle
      uses: actions/cache@v6
      with:
        path: ~/dummy-app-bundle
        # Keyed on the Gemfile, not the lockfile: the dummy app's Gemfile.lock is gitignored, so
        # hashFiles found nothing and the key collapsed to a constant that never invalidated.
        key: ${{ runner.os }}-dummy-app-bundle-v2-${{ hashFiles('spec_rails/dummy_app/Gemfile') }}
        restore-keys: |
          ${{ runner.os }}-dummy-app-bundle-v2-
    - name: Install dummy app dependencies
      run: |
        cd spec_rails/dummy_app
        bundle config set --local path "$HOME/dummy-app-bundle"
        bundle install
    - name: Run Rails specs
      run: bundle exec rake spec_rails

  docs_links:
    runs-on: ubuntu-latest
    name: Docs Link Check
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: yarn
    - name: Install dependencies
      run: yarn install
    - name: Build docs and verify internal links
      run: yarn docs:check
